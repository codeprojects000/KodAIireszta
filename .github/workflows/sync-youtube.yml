name: Sync portal content

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portal-content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Aktualizuj filmy
        run: node scripts/sync-youtube.cjs

      - name: Aktualizuj projekty
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-github.cjs

      - name: Zapisz zmiany
        run: |
          git add -- content.json content.js assets
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update portal content"
          git push
